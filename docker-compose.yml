name: festival

x-app: &app
  image: festival-app:dev
  # Only web builds the image (see below) and css/sidekiq reuse it: building it
  # once per service in parallel fails on a fresh machine with "image already
  # exists". It's never pulled from a registry.
  pull_policy: never
  # The bundle volume below outlives image rebuilds, so it won't have gems
  # added to the Gemfile since it was created; install them before starting.
  entrypoint: ["sh", "-c", 'bundle check >/dev/null || bundle install && exec "$$@"', "--"]
  volumes:
    - .:/rails                 # live-mount the source so host edits reflect instantly
    - bundle:/usr/local/bundle # keep installed gems in a named volume, not the bind mount
  environment: &app-env
    RAILS_ENV: development
    DATABASE_HOST: db
    DATABASE_PORT: 5432
    DATABASE_USER: postgres
    DATABASE_PASSWORD: postgres
    REDIS_URL: redis://redis:6379/0
    FESTIVAL_API_URL: http://web:3000
    # Rails' development host check only allows localhost-style hosts; the sync
    # calls the mock API as "web", so allow it or every request gets a 403.
    RAILS_DEVELOPMENT_HOSTS: web
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: festival_development
    ports:
      - "5544:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data

  web:
    <<: *app
    build: .
    command: sh -c "rm -f tmp/pids/server.pid && bin/rails db:prepare && bin/rails tailwindcss:build && bin/rails server -b 0.0.0.0 -p 3000"
    ports:
      - "3000:3000"
    stdin_open: true   
    tty: true

  css:
    <<: *app
    command: bin/rails tailwindcss:watch[always]

  sidekiq:
    <<: *app
    command: bundle exec sidekiq

volumes:
  pgdata:
  redisdata:
  bundle:
